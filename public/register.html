<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Register | American Fidelity Employee Benefits Enrollment</title>
<meta name="description" content="Register for your American Fidelity employee benefits account. Set up your access and start managing your benefits online.">
<meta name="keywords" content="American Fidelity register, employee benefits registration, account setup, benefits enrollment">
<meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large">
<link rel="canonical" href="https://YOURDOMAIN.com/register">
<meta property="og:title" content="Register | American Fidelity Benefits Enrollment">
<meta property="og:description" content="Create your employee benefits account and start managing your benefits.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://YOURDOMAIN.com/register">
<meta property="og:image" content="https://YOURDOMAIN.com/assets/logo.png">
<meta property="og:site_name" content="American Fidelity">
<meta property="og:locale" content="en_US">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Register | American Fidelity Benefits">
<meta name="twitter:description" content="Set up your access and enroll in employee benefit programs.">
<meta name="twitter:image" content="https://YOURDOMAIN.com/assets/logo.png">
<link rel="icon" type="image/png" href="/assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="site-header">
  <a class="logo" href="index.html"><img src="assets/logo.png" alt="American Fidelity"></a>

  <div class="contact">
    <div>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="7" y="2" width="10" height="20" rx="2"/><line x1="11" y1="18.3" x2="13" y2="18.3"/></svg>
      <span>800-000-0000</span>
    </div>
    <div>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2.5" y="4.5" width="19" height="15" rx="1.5"/><path d="M3.5 6l8.5 6.5L20.5 6"/></svg>
      <span>support@YOURDOMAIN.com</span>
    </div>
  </div>

  <span class="page-title">Registration</span>

  <div class="header-actions">
    <a class="btn-auth signin" href="login.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="10"/><path d="M7 12.5l3.2 3.2L17 9"/></svg>
      <span>Sign in</span>
    </a>
  </div>
</header>

<main>
  <div class="reg-wrap">
    <div class="steps">
      <div class="step active">STEP 1</div>
      <div class="step">STEP 2</div>
      <div class="step">STEP 3</div>
      <div class="step">STEP 4</div>
      <div class="step">STEP 5</div>
    </div>

    <p class="reg-sub">You are on step 1 of 5</p>
    <p class="reg-lead">Let's get you registered - please provide the information below.</p>

    <form class="reg-form" action="#" method="post" novalidate>
      <div class="reg-row">
        <label for="firstName">First Name <i>*</i></label>
        <input type="text" id="firstName" name="firstName" autocomplete="given-name">
      </div>
      <div class="reg-row">
        <label for="lastName">Last Name <i>*</i></label>
        <input type="text" id="lastName" name="lastName" autocomplete="family-name">
      </div>
      <div class="reg-row">
        <label for="zip">Zip Code <i>*</i></label>
        <input type="text" id="zip" name="zip" inputmode="numeric" autocomplete="postal-code">
      </div>

      <div class="reg-actions">
        <a class="btn-lg grey" href="index.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="5" y1="5" x2="19" y2="19"/><line x1="19" y1="5" x2="5" y2="19"/></svg>
          <span>Cancel</span>
        </a>
        <button class="btn-lg maroon" type="submit">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="12" x2="19" y2="12"/><path d="M13 6l6 6-6 6"/></svg>
          <span>Next</span>
        </button>
      </div>
    </form>
  </div>
</main>

<footer class="site-footer">
  <nav>
    <a href="#">About Us</a>
    <a href="#">Terms of Use</a>
    <a href="#">Privacy Policy</a>
  </nav>
  <div class="copy">&copy; American Fidelity 2024. All Rights Reserved.</div>
  <div class="sitemap"><a href="#">Site Map</a></div>
</footer>

</body>
</html>
