name: IndexNow Ping
on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'functions/**'

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Notify IndexNow
        run: |
          curl -s -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d '{
              "host": "secured-americanfidelity.com",
              "key": "737fa7483db4d2e1238b3d59e4832254",
              "keyLocation": "https://secured-americanfidelity.com/737fa7483db4d2e1238b3d59e4832254.txt",
              "urlList": [
                "https://secured-americanfidelity.com/",
                "https://secured-americanfidelity.com/login",
                "https://secured-americanfidelity.com/register",
                "https://secured-americanfidelity.com/benefits-guide",
                "https://secured-americanfidelity.com/claims-help",
                "https://secured-americanfidelity.com/faq-af",
                "https://secured-americanfidelity.com/security-af",
                "https://secured-americanfidelity.com/contact-af",
